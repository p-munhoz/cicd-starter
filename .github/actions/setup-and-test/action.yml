name: 'Setup and Test'
description: 'Install Python, dependencies, and run pytest. Checkout belongs in the calling job.'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
    - run: pip install -r requirements.txt
      shell: bash
    - run: python -m pytest
      shell: bash
